server.port=${PORT:8000}
serpapi.api-key=${SERPAPI_API_KEY:}
serpapi.timeout-seconds=${SERPAPI_TIMEOUT_SECONDS:20}
serpapi.timeout-optional-seconds=${SERPAPI_TIMEOUT_OPTIONAL_SECONDS:8}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.use-cache=${USE_CACHE:true}
app.cache-dir=.cache
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
logging.level.com.ghoomlo=INFO
